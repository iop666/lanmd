[package]
name = "lanmd-app"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "lanmd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
lanmd-server = { path = "../server" }
log = "0.4"
open = "5"
serde_json = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
