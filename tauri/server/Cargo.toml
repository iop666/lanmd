[package]
name = "lanmd-server"
version = "1.0.0"
edition = "2021"

[lib]
name = "lanmd_server"
path = "src/lib.rs"

[[bin]]
name = "lanmd-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
notify = "8"
sha1 = "0.10"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
include_dir = "0.7"
percent-encoding = "2"
qrcode = "0.14"
base64 = "0.22"
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# 仅测试目标使用：io-util（AsyncReadExt/AsyncWriteExt）与 net（TcpStream）
tokio = { version = "1", features = ["io-util", "net"] }

