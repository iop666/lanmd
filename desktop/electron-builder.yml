appId: com.lanmd.desktop
productName: Lanmd
directories:
  output: release
  buildResources: build
files:
  - '*.js'
  - 'package.json'
  - 'server-dist/**/*'
  - '!**/*.map'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon-warn.ico
    to: icon-warn.ico
  - from: build/icon-tray-16.png
    to: icon-tray-16.png
  - from: build/icon-tray-32.png
    to: icon-tray-32.png
  - from: build/icon-tray-warn-16.png
    to: icon-tray-warn-16.png
  - from: build/icon-tray-warn-32.png
    to: icon-tray-warn-32.png
  - from: ../web/dist
    to: web
asar: true
win:
  target: portable
  icon: build/icon.ico
portable:
  artifactName: Lanmd.exe
npmRebuild: false
